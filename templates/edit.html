{% extends "layout.html" %}
{% block title %}Editar Catequizando{% endblock %}
{% block content %}
<h2>Editar Catequizando</h2>

<form method="POST">
  <label>ID:</label>
  <input type="number" name="Id" value="{{ catequizando.Id }}" readonly>

  <label>Nombre:</label>
  <input type="text" name="Nombre" value="{{ catequizando.Nombre }}" required>

  <label>Apellido:</label>
  <input type="text" name="Apellido" value="{{ catequizando.Apellido }}" required>

  <label>Fecha de Nacimiento:</label>
  <input type="date" name="FechaNacimiento" value="{{ catequizando.FechaNacimiento }}" required>

  <label>¿Está Bautizado?</label>
  <select name="FeBautismo">
    <option value="1" {% if catequizando.FeBautismo %}selected{% endif %}>Sí</option>
    <option value="0" {% if not catequizando.FeBautismo %}selected{% endif %}>No</option>
  </select>

  <button type="submit">Actualizar</button>
</form>

<a href="{{ url_for('index') }}">Volver al listado</a>
{% endblock %}
