{% extends "layout.html" %}
{% block title %}Editar Catequizado{% endblock %}
{% block content %}
<h2>Editar Catequizado</h2>

<form method="POST" class="form">
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" name="nombre" value="{{ catequizado.nombre }}" required>

  <label for="apellido">Apellido:</label>
  <input type="text" id="apellido" name="apellido" value="{{ catequizado.apellido }}" required>

  <label for="dob">Fecha de Nacimiento:</label>
  <input type="date" id="dob" name="dob" value="{{ catequizado.dob }}" required>

  <label for="fe_bautismo">
    <input type="checkbox" id="fe_bautismo" name="fe_bautismo" {% if catequizado.fe_bautismo %}checked{% endif %}>
    ¿Tiene fe de bautismo?
  </label>

  <button type="submit" class="btn btn-primary">Actualizar</button>
</form>
{% endblock %}
